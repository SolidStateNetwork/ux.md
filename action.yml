name: 'UX.md Structural Linter'
description: 'Validate UX.md structural UI/UX specifications (viewport budgets, z-index scales, route reachability, 4-state views, and live code parity).'
author: 'SolidStateNetwork'
branding:
  icon: 'layout'
  color: 'blue'

inputs:
  file:
    description: 'Path to the UX.md file to validate.'
    required: false
    default: 'UX.md'
  strict:
    description: 'Treat linter warnings as errors.'
    required: false
    default: 'true'
  check-code:
    description: 'Verify live route parity against discovered source routes (src/app, src/pages, src/routes).'
    required: false
    default: 'false'
  source-dir:
    description: 'Optional source directory to scan when check-code is enabled.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Run UX.md Validator
      shell: bash
      env:
        INPUT_FILE: ${{ inputs.file }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_CHECK_CODE: ${{ inputs.check-code }}
        INPUT_SOURCE_DIR: ${{ inputs.source-dir }}
      run: |
        ARGS=("$INPUT_FILE")
        if [ "$INPUT_STRICT" = "true" ]; then
          ARGS+=("--strict")
        fi
        if [ "$INPUT_CHECK_CODE" = "true" ]; then
          ARGS+=("--check-code")
          if [ -n "$INPUT_SOURCE_DIR" ]; then
            ARGS+=("$INPUT_SOURCE_DIR")
          fi
        fi
        node "${{ github.action_path }}/skills/ux-md-generator/scripts/validate-ux.mjs" "${ARGS[@]}"
