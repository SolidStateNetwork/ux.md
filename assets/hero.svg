<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280" role="img" aria-label="UX.md: Structural UI/UX specification standard for AI coding agents">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1F2937" stroke-width="0.75" />
    </pattern>
  </defs>

  <rect width="960" height="280" rx="12" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="1.5" />
  <rect width="960" height="280" rx="12" fill="url(#grid)" opacity="0.55" />

  <g transform="translate(44, 46)">
    <rect x="0" y="0" width="196" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#38BDF8" />
    <text x="26" y="17" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">SPECIFICATION v1.0</text>

    <text x="0" y="76" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">UX.md</text>
    <text x="155" y="76" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500">/ skeleton-spec</text>

    <text x="0" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">
      The structural UI/UX companion to <tspan fill="#E2E8F0" font-family="ui-monospace, monospace">DESIGN.md</tspan> and <tspan fill="#E2E8F0" font-family="ui-monospace, monospace">AGENTS.md</tspan>.
    </text>
    <text x="0" y="136" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">
      App shells, page archetypes, route graphs, 4-state contracts, and layout primitives.
    </text>

    <g transform="translate(0, 162)">
      <rect x="0" y="0" width="136" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="12" y="19" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11.5">AGENTS.md = Brain</text>

      <rect x="148" y="0" width="136" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="160" y="19" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11.5">DESIGN.md = Skin</text>

      <rect x="296" y="0" width="150" height="30" rx="6" fill="#0C2D48" stroke="#38BDF8" stroke-width="1.2" />
      <text x="310" y="19" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">UX.md = Skeleton</text>
    </g>
  </g>

  <g transform="translate(560, 32)">
    <rect x="0" y="0" width="356" height="216" rx="8" fill="#090D16" stroke="#334155" stroke-width="1.5" />

    <rect x="0" y="0" width="356" height="28" rx="8" fill="#1E293B" />
    <circle cx="14" cy="14" r="3.5" fill="#475569" />
    <circle cx="25" cy="14" r="3.5" fill="#475569" />
    <circle cx="36" cy="14" r="3.5" fill="#475569" />
    <text x="52" y="18" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">AppShell (1280px budget | CLS=0)</text>

    <rect x="10" y="38" width="74" height="168" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="18" y="54" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="9" font-weight="600">Nav 240px</text>
    <rect x="18" y="64" width="56" height="8" rx="2" fill="#1E293B" />
    <rect x="18" y="78" width="48" height="8" rx="2" fill="#38BDF8" opacity="0.35" />
    <rect x="18" y="92" width="52" height="8" rx="2" fill="#1E293B" />
    <text x="18" y="196" fill="#64748B" font-family="ui-monospace, monospace" font-size="8">z-index: 20</text>

    <rect x="92" y="38" width="166" height="32" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="100" y="53" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">&lt;PageHeader&gt;</text>
    <rect x="204" y="45" width="46" height="16" rx="3" fill="#0284C7" />
    <text x="211" y="56" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="7.5" font-weight="600">+ Action</text>

    <rect x="92" y="76" width="166" height="130" rx="4" fill="#0F172A" stroke="#0284C7" stroke-width="1" stroke-dasharray="3 2" />
    <text x="100" y="92" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">&lt;DataStateBoundary&gt;</text>
    <text x="100" y="106" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="8">[x] Loading (Skeleton)</text>
    <text x="100" y="120" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="8">[x] Empty (Copy + CTA)</text>
    <text x="100" y="134" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="8">[x] Error (In-place Retry)</text>
    <text x="100" y="148" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="8">[x] Populated (tabular-nums)</text>
    <text x="100" y="196" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="8">URL: ?q=&amp;inspect=id</text>

    <rect x="266" y="38" width="80" height="168" rx="4" fill="#111C2D" stroke="#38BDF8" stroke-width="1.2" />
    <text x="274" y="54" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">Drawer 540px</text>
    <text x="274" y="68" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="7.5">&gt;= 5 fields</text>
    <rect x="274" y="78" width="64" height="10" rx="2" fill="#1E293B" />
    <rect x="274" y="94" width="64" height="10" rx="2" fill="#1E293B" />
    <rect x="274" y="110" width="64" height="24" rx="2" fill="#1E293B" />
    <text x="274" y="182" fill="#F59E0B" font-family="ui-monospace, monospace" font-size="7.5">isDirty Guard</text>
    <text x="274" y="196" fill="#64748B" font-family="ui-monospace, monospace" font-size="8">z-index: 30</text>
  </g>
</svg>
