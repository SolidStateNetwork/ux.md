<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">UX.md Three-Phase Agent Pipeline: Extract, Generate, and Validate</title>
  <desc id="desc">Pipeline diagram showing Phase 1 (npx ux-md extract scans package.json, DESIGN.md, and src/app routes), Phase 2 (npx ux-md generate synthesizes the 12-section UX.md specification), and Phase 3 (npx ux-md validate --strict --check-code verifies 12 structural rules and renders ux-preview.html).</desc>

  <rect width="1200" height="280" rx="14" fill="#0B0F17" stroke="#334155" stroke-width="2" />

  <g id="phase-1" transform="translate(36, 36)">
    <rect x="0" y="0" width="348" height="208" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="38" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">PHASE 1: EXTRACT</text>
    <text x="20" y="70" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="22" font-weight="700">Scan repo &amp; routes</text>
    <text x="20" y="104" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18">Reads package.json, DESIGN.md,</text>
    <text x="20" y="130" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18">and src/app or src/pages routes.</text>
    <rect x="20" y="152" width="308" height="36" rx="6" fill="#0B0F17" stroke="#334155" stroke-width="1" />
    <text x="32" y="176" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">npx ux-md extract .</text>
  </g>

  <path d="M 392 140 L 420 140" stroke="#38BDF8" stroke-width="2.5" />
  <polygon points="418,133 430,140 418,147" fill="#38BDF8" />

  <g id="phase-2" transform="translate(436, 36)">
    <rect x="0" y="0" width="348" height="208" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="38" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">PHASE 2: SYNTHESIZE</text>
    <text x="20" y="70" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="22" font-weight="700">12-section UX.md</text>
    <text x="20" y="104" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18">Locks shell budget, z-index scale,</text>
    <text x="20" y="130" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18">archetypes, and 4-state views.</text>
    <rect x="20" y="152" width="308" height="36" rx="6" fill="#0B0F17" stroke="#334155" stroke-width="1" />
    <text x="32" y="176" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">npx ux-md init</text>
  </g>

  <path d="M 792 140 L 820 140" stroke="#38BDF8" stroke-width="2.5" />
  <polygon points="818,133 830,140 818,147" fill="#38BDF8" />

  <g id="phase-3" transform="translate(836, 36)">
    <rect x="0" y="0" width="328" height="208" rx="10" fill="#0C2D48" stroke="#38BDF8" stroke-width="2" />
    <text x="20" y="38" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">PHASE 3: ENFORCE</text>
    <text x="20" y="70" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="22" font-weight="700">12-rule linter &amp; CI</text>
    <text x="20" y="104" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18">Verifies route parity in code</text>
    <text x="20" y="130" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18">and builds ux-preview.html.</text>
    <rect x="20" y="152" width="288" height="36" rx="6" fill="#0B0F17" stroke="#38BDF8" stroke-width="1" />
    <text x="32" y="176" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">npx ux-md validate</text>
  </g>
</svg>
