<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">UX.md Three-Phase Agent Pipeline: Extract, Synthesize, and Enforce</title>
  <desc id="desc">Pipeline diagram showing Phase 1 (npx ux-md extract scans package.json, DESIGN.md, and src/app routes), Phase 2 (npx ux-md init synthesizes the 12-section UX.md specification), and Phase 3 (npx ux-md validate verifies 12 structural rules and builds ux-preview.html).</desc>

  <rect width="1200" height="260" rx="14" fill="#0B0F17" stroke="#334155" stroke-width="2" />

  <g id="phase-1" transform="translate(36, 32)">
    <rect x="0" y="0" width="340" height="196" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <text x="22" y="34" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">PHASE 1: EXTRACT</text>
    <text x="22" y="66" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="21" font-weight="700">Scan repo &amp; routes</text>
    <text x="22" y="96" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16">Reads package.json, DESIGN.md,</text>
    <text x="22" y="120" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16">and src/app or src/pages routes.</text>
    <rect x="22" y="140" width="296" height="36" rx="6" fill="#0B0F17" stroke="#334155" stroke-width="1" />
    <text x="34" y="164" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">npx ux-md extract .</text>
  </g>

  <path d="M 386 130 L 414 130" stroke="#38BDF8" stroke-width="2.5" />
  <polygon points="412,123 424,130 412,137" fill="#38BDF8" />

  <g id="phase-2" transform="translate(430, 32)">
    <rect x="0" y="0" width="340" height="196" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <text x="22" y="34" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">PHASE 2: SYNTHESIZE</text>
    <text x="22" y="66" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="21" font-weight="700">12-section UX.md</text>
    <text x="22" y="96" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16">Locks shell budget, z-index scale,</text>
    <text x="22" y="120" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16">archetypes, and 4-state views.</text>
    <rect x="22" y="140" width="296" height="36" rx="6" fill="#0B0F17" stroke="#334155" stroke-width="1" />
    <text x="34" y="164" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">npx ux-md init</text>
  </g>

  <path d="M 780 130 L 808 130" stroke="#38BDF8" stroke-width="2.5" />
  <polygon points="806,123 818,130 806,137" fill="#38BDF8" />

  <g id="phase-3" transform="translate(824, 32)">
    <rect x="0" y="0" width="340" height="196" rx="10" fill="#0C2D48" stroke="#38BDF8" stroke-width="2" />
    <text x="22" y="34" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">PHASE 3: ENFORCE &amp; SCAFFOLD</text>
    <text x="22" y="66" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="21" font-weight="700">16-rule linter &amp; code</text>
    <text x="22" y="96" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16">Checks route parity, primitives,</text>
    <text x="22" y="120" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16">and scaffolds TSX + preview.</text>
    <rect x="22" y="140" width="296" height="36" rx="6" fill="#0B0F17" stroke="#38BDF8" stroke-width="1" />
    <text x="34" y="164" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">npx ux-md validate | scaffold</text>
  </g>
</svg>
